name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Don't hardcode the version; read the packageManager field from package.json directly
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # Starting with 16.3, Turbopack caches build artifacts in .next/cache by default, and reusing them across builds can significantly speed things up
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-next-
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # lib/auth.ts calls getAuthSecret() during module evaluation, so if this variable is missing in production, it throws immediately,
      # and the page data collection step fails. Locally, an uncommitted .env.local covers this; CI doesn't have one.
      # This is only a build check, so a placeholder value is enough; it doesn't need to be a real secret.
      - run: pnpm build
        env:
          BETTER_AUTH_SECRET: ci-build-only-placeholder
      # Vulnerabilities in transitive dependencies often can't be fixed right away, so report them without blocking the build
      - run: pnpm audit --prod
        continue-on-error: true
