name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 不写死版本，直接读 package.json 的 packageManager 字段
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # Turbopack 从 16.3 起默认把构建产物缓存到 .next/cache，跨构建复用可大幅提速
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-next-
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # lib/auth.ts 在模块求值时就调 getAuthSecret(),production 下缺这个变量直接抛错,
      # 收集页面数据那步就会挂。本地有未提交的 .env.local 兜着,CI 没有。
      # 只做构建校验,占位值即可,不用配成真 secret。
      - run: pnpm build
        env:
          BETTER_AUTH_SECRET: ci-build-only-placeholder
      # 传递依赖的漏洞往往一时半会儿修不掉，所以只报告不拦人
      - run: pnpm audit --prod
        continue-on-error: true
